name: Integration metadata

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.10"
      - name: Install validation tools
        run: |
          python3 -m pip install PyYAML==6.0.2
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: Validate locked manifests and release schema
        run: python3 scripts/validate_manifests.py
      - name: Validate Python syntax
        run: python3 -m compileall -q scripts
      - name: Validate shell entry points
        run: |
          bash -n scripts/import_workspace.sh
          bash -n scripts/build_x86.sh
          bash -n scripts/test_x86.sh
          shellcheck --severity=warning scripts/*.sh

